<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Itens na nuvem</title>

<!-- PWA meta -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a7d0f3"/>
<link rel="icon" href="icons/icon-192.png">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#a7d0f3; --bg2:#e8c7ff; --accent1:#4a148c; --accent2:#6a1b9a;
  --card-bg: rgba(255,255,255,0.55);
  --glass: rgba(255,255,255,0.25);
}
*{box-sizing:border-box}
html,body{height:100%; margin:0; padding:0; font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto; background:linear-gradient(135deg,var(--bg1),var(--bg2)); color:var(--accent1); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
a{color:inherit; text-decoration:none}

/* Layout */
.wrapper{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2vmax;}
.game-card{
  width:min(1100px,96%);
  background:var(--card-bg); border-radius:20px; padding:clamp(18px,3vw,36px);
  box-shadow:0 20px 40px rgba(0,0,0,0.12); backdrop-filter: blur(8px);
  display:flex; flex-direction:column; align-items:center;
}
.header{width:100%; display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem;}
.title{font-size:clamp(1.6rem,3.2vw,2.4rem); font-weight:900; color:var(--accent1); text-align:center; flex:1}
.controls{display:flex; gap:0.75rem; align-items:center}
.icon-btn{width:56px;height:56px;border-radius:50%;border:none!important;background:linear-gradient(135deg,#e0aaff,#aa22ff); color:#fff; display:grid;place-items:center; box-shadow:0 6px 15px rgba(0,0,0,0.2); cursor:pointer}
.icon-btn:active{transform:scale(.96)}
.start-overlay{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#fbc2eb,#a6c0fe); z-index:999; transition:opacity .25s}
.start-card{background:white;padding:2rem;border-radius:18px;text-align:center; max-width:520px; width:90%}
.start-card h1{margin:0 0 1rem 0; color:#4a148c}
.start-card button{background:linear-gradient(135deg,#5c8dff,#ff60d2); color:white;border:none;padding:12px 24px;border-radius:999px; font-weight:700; cursor:pointer}

/* Main area */
.main-game{display:flex; gap:clamp(1rem,4vw,3rem); align-items:flex-start; width:100%; flex-wrap:wrap; justify-content:center}
.cloud-wrap{flex:1; min-width:260px; display:flex; justify-content:center; align-items:center}
#cloud-container{position:relative; width:min(540px,70%); max-width:640px; height:min(260px,35vh); display:flex; align-items:center; justify-content:center; transition:box-shadow .25s; border-radius:18px; background:transparent}
#cloud-bg{width:100%; height:100%; object-fit:contain; pointer-events:none}
#cloud-item{position:absolute; width:min(220px,40%); height:auto; transform:translateY(-10%); opacity:.35; transition:opacity .3s, transform .25s; pointer-events:none}

/* options */
.options{display:flex; gap:clamp(1rem,5vw,3rem); flex:1; justify-content:center; flex-wrap:wrap}
.option{
  width:min(170px,22vw); height:min(170px,22vw); border-radius:18px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(145deg,#bbfffe,#d0d7fd);
  box-shadow:6px 6px 18px rgba(0,0,0,0.12), -6px -6px 18px rgba(255,255,255,0.6);
  cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
  transition:transform .18s, box-shadow .18s, opacity .2s;
}
.option:active{cursor:grabbing; transform:scale(.98)}
.option img{max-width:80%; max-height:80%}
.option.hidden{opacity:0; pointer-events:none; transform:scale(.95)}

/* instruction */
.instruction{width:100%; text-align:center; font-weight:700; color:var(--accent2); margin:14px 0 6px 0}

/* robot */
#robot{position:relative; width:100%; max-width:420px; height:auto; margin-top:6px; transition:transform .2s}
#robot.dance{animation:dance 1s ease}
@keyframes dance{0%{transform:rotate(0)}25%{transform:rotate(12deg)}50%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}100%{transform:rotate(0)}}

/* lockscreen */
.lock-screen{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.6); z-index:2000}
.lock-box{background:var(--glass); padding:20px;border-radius:16px;max-width:340px;width:90%; text-align:center; border:1px solid rgba(255,255,255,0.28)}
.lock-box input{padding:10px;border-radius:10px;border:2px solid #f2e2ff;background:#f8f0ff;width:100%;}

/* responsive tweaks */
@media (max-width:720px){
  .game-card{padding:16px}
  .title{font-size:1.4rem}
  .options{gap:12px}
  .option{width:110px;height:110px;border-radius:14px}
  #cloud-item{width:120px}
  #robot{max-width:260px}
}
</style>
</head>
<body>

<div class="wrapper">
  <div class="game-card" role="application" aria-label="Jogo Arraste o item para a nuvem">
    <div class="header">
      <a href="Jogos.html" class="icon-btn" aria-label="Voltar">⬅</a>
      <div class="title">Arraste o item para a nuvem!</div>
      <div class="controls">
        <button id="installBtn" class="icon-btn" aria-label="Instalar">⤓</button>
        <button id="restart-button" class="icon-btn" aria-label="Reiniciar">⟳</button>
      </div>
    </div>

    <div class="instruction" id="instruction-text">Arraste a música para a nuvem.</div>

    <div class="main-game">
      <div class="cloud-wrap">
        <div id="cloud-container" aria-label="Alvo da nuvem">
          <img id="cloud-bg" src="nuvem2.png" alt="Nuvem">
          <img id="cloud-item" src="" alt="Item esperado" aria-hidden="true">
        </div>
      </div>

      <div class="options" id="options">
        <div class="option" id="music" role="button" tabindex="0" aria-label="Música" data-type="music">
          <img src="musica2.png" alt="">
        </div>
        <div class="option" id="photo" role="button" tabindex="0" aria-label="Foto" data-type="photo">
          <img src="foto2.png" alt="">
        </div>
        <div class="option" id="game" role="button" tabindex="0" aria-label="Videogame" data-type="game">
          <img src="videogame2.png" alt="">
        </div>
      </div>
    </div>

    <div id="robot-area" style="display:flex;justify-content:center;"></div>
  </div>
</div>

<!-- Start overlay (required for audio autoplay user gesture) -->
<div id="start-screen" class="start-overlay" aria-hidden="false">
  <div class="start-card">
    <h1>Bem-vindo ao Itens na nuvem!</h1>
    <p style="margin:0 0 1rem">Toque em "Começar" para ativar sons e iniciar o jogo.</p>
    <button id="start-game-btn">Começar</button>
  </div>
</div>

<!-- Lock screen (parental) -->
<div class="lock-screen" id="lock-screen" aria-hidden="true">
  <div class="lock-box" role="dialog" aria-modal="true" aria-label="Painel parental">
    <p style="margin:0;color:#6a0dad;font-weight:600">Painel Parental</p>
    <h2 style="margin:.5rem 0 0 0;color:var(--accent1)">Tempo esgotado!</h2>
    <p style="margin:.5rem 0">Digite a senha para continuar jogando:</p>
    <input type="password" id="unlockPassword" placeholder="Senha">
    <button style="margin-top:8px;padding:10px;border-radius:10px;background:linear-gradient(135deg,#a6c0fe,#fbc2eb);border:none;color:white;font-weight:700" onclick="unlockGame()">Desbloquear</button>
    <p id="unlockFeedback" style="color:red;font-weight:bold;margin-top:8px;"></p>
  </div>
</div>

<!-- Sounds (preload but won't autoplay until user gesture) -->
<audio id="victory-sound" src="itenscarregados.mp3" preload="auto"></audio>
<audio id="correct-sound" src="itemcorreto.mp3" preload="auto"></audio>
<audio id="wrong-sound" src="itemerrado.mp3" preload="auto"></audio>
<audio id="robot-music-sound" src="robomusica.mp3" preload="auto"></audio>
<audio id="robot-photo-sound" src="robofoto.mp3" preload="auto"></audio>
<audio id="robot-game-sound" src="robojogo.mp3" preload="auto"></audio>
<audio id="entrance-sound" src="oqueenuvem.mp3" preload="auto"></audio>
<audio id="after-sound" src="conecteoscabos.mp3" preload="auto"></audio>

<script>
/* ========== Configurações ========== */
const sequence = ['music','photo','game'];
const itemImages = { music: 'musica2.png', photo: 'foto2.png', game: 'videogame2.png' };
const instructionSequence = [
  'Arraste a música para a nuvem.',
  'Agora, arraste a foto para a nuvem.',
  'Por fim, arraste o videogame para a nuvem.'
];
const robotGifs = { music: 'robodanca (3).gif', photo: 'robofoto.gif', game: 'robojogo.gif' };

let current = 0;
let robot = null;
let currentRobotSound = null;
let startScreen = document.getElementById('start-screen');

/* Setup initial */
const cloudItem = document.getElementById('cloud-item');
const cloudContainer = document.getElementById('cloud-container');
const instructionText = document.getElementById('instruction-text');
cloudItem.src = itemImages[sequence[current]];
cloudItem.style.opacity = '.35';
instructionText.textContent = instructionSequence[current];

/* Audio references */
const sounds = {
  correct: document.getElementById('correct-sound'),
  wrong: document.getElementById('wrong-sound'),
  robotMusic: document.getElementById('robot-music-sound'),
  robotPhoto: document.getElementById('robot-photo-sound'),
  robotGame: document.getElementById('robot-game-sound'),
  entrance: document.getElementById('entrance-sound'),
  after: document.getElementById('after-sound'),
  victory: document.getElementById('victory-sound')
};

/* Ensure audio will play only after user gesture: start button */
document.getElementById('start-game-btn').addEventListener('click', async () => {
  startScreen.style.display = 'none';
  // try play entrance sounds in chain
  try {
    await sounds.entrance.play();
    sounds.entrance.onended = () => sounds.after.play().catch(()=>{});
  } catch(e){ /* autoplay blocked */ }
  // start parental timer if set
  if(localStorage.getItem('gameLimit') && localStorage.getItem('gameStart')) startTimerGame();
});

/* ========== Drag & Touch handling (robust) ========== */
const optionsWrap = document.getElementById('options');
let dragging = null;
let offsetX=0, offsetY=0;

function onOptionPointerDown(e){
  const target = e.currentTarget;
  e.preventDefault();
  dragging = target;
  target.setPointerCapture(e.pointerId);
  target.classList.add('dragging');
  const rect = target.getBoundingClientRect();
  offsetX = (e.clientX || e.touches?.[0]?.clientX) - rect.left;
  offsetY = (e.clientY || e.touches?.[0]?.clientY) - rect.top;
  target.style.position = 'fixed';
  target.style.zIndex = 9999;
  moveDragged(e);
}
function moveDragged(e){
  if(!dragging) return;
  const clientX = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
  const clientY = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0].clientY);
  dragging.style.left = (clientX - offsetX) + 'px';
  dragging.style.top = (clientY - offsetY) + 'px';
}
function endDragged(e){
  if(!dragging) return;
  // check drop over cloud
  const clientX = (e.clientX !== undefined) ? e.clientX : (e.changedTouches && e.changedTouches[0].clientX);
  const clientY = (e.clientY !== undefined) ? e.clientY : (e.changedTouches && e.changedTouches[0].clientY);
  const elements = document.elementsFromPoint(clientX, clientY);
  const cloudAtPoint = elements.find(el => el === cloudContainer || el.id === 'cloud-bg' || el.id === 'cloud-container');
  const id = dragging.id;
  dragging.style.position = '';
  dragging.style.left = '';
  dragging.style.top = '';
  dragging.style.zIndex = '';
  dragging.classList.remove('dragging');

  if(currentRobotSound){
    currentRobotSound.loop=false;
    currentRobotSound.pause();
    currentRobotSound.currentTime=0;
    currentRobotSound=null;
  }

  if(cloudAtPoint){
    handleDrop(id);
  }
  dragging = null;
}

/* Add pointer listeners to each option */
document.querySelectorAll('.option').forEach(opt=>{
  opt.addEventListener('pointerdown', onOptionPointerDown);
  opt.addEventListener('pointermove', moveDragged);
  opt.addEventListener('pointerup', endDragged);
  opt.addEventListener('pointercancel', endDragged);

  // keyboard accessibility: press Enter to "drop" on target (useful for a11y)
  opt.addEventListener('keydown', (ev)=>{
    if(ev.key === 'Enter' || ev.key === ' '){
      ev.preventDefault();
      // simulate drop if focused on cloud (we assume order)
      const type = opt.dataset.type || opt.id;
      handleDrop(type);
    }
  });
});

/* Also support native dragstart for desktop pointer */
document.querySelectorAll('.option').forEach(item=>{
  item.setAttribute('draggable','true');
  item.addEventListener('dragstart', e=>{
    e.dataTransfer.setData('text/plain', e.currentTarget.id);
    // create ghost image minimal
    const ghost = e.currentTarget.cloneNode(true);
    ghost.style.position='absolute'; ghost.style.top='-9999px';
    document.body.appendChild(ghost);
    e.dataTransfer.setDragImage(ghost, ghost.offsetWidth/2, ghost.offsetHeight/2);
    setTimeout(()=>document.body.removeChild(ghost),0);
  });
});
cloudContainer.addEventListener('dragover', e=>e.preventDefault());
cloudContainer.addEventListener('drop', e=>{
  e.preventDefault();
  const id = e.dataTransfer.getData('text/plain');
  handleDrop(id);
});

function handleDrop(id){
  const draggedElement = document.getElementById(id) || document.querySelector(`.option[data-type="${id}"]`);
  if(!draggedElement) return;

  if(id === sequence[current]){
    sounds.correct.play().catch(()=>{});
    // robot
    if(!robot){
      robot = document.createElement('img');
      robot.id = 'robot';
      robot.src = robotGifs[id];
      robot.alt = '';
      document.getElementById('robot-area').appendChild(robot);
    } else {
      robot.src = robotGifs[id];
    }
    robot.classList.add('dance');
    setTimeout(()=>robot.classList.remove('dance'),900);

    if(id === 'music') currentRobotSound = sounds.robotMusic;
    if(id === 'photo') currentRobotSound = sounds.robotPhoto;
    if(id === 'game') currentRobotSound = sounds.robotGame;

    currentRobotSound.currentTime = 0;
    currentRobotSound.loop = true;
    currentRobotSound.play().catch(()=>{});

    cloudContainer.classList.add('correct');
    setTimeout(()=>cloudContainer.classList.remove('correct'),300);

    cloudItem.src = itemImages[id];
    cloudItem.style.opacity = '1';
    draggedElement.classList.add('hidden');
    current++;

    if(current < sequence.length){
      setTimeout(()=>{
        cloudItem.src = itemImages[sequence[current]];
        cloudItem.style.opacity = '.35';
        instructionText.textContent = instructionSequence[current];
      }, 1400);
    } else {
      // vitória: registra histórico e toca som
      sounds.victory.play().catch(()=>{});
      recordHistory();
      // partículas leves
      spawnParticles();
    }
  } else {
    sounds.wrong.play().catch(()=>{});
    // pequena vibração (mobile)
    if(navigator.vibrate) navigator.vibrate(80);
  }
}

/* PARTICULAS SIMPLES */
function spawnParticles(){
  const count = 20;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.position='fixed';
    p.style.left = (window.innerWidth/2 + (Math.random()-0.5)*300) + 'px';
    p.style.top = (window.innerHeight/2 + (Math.random()-0.5)*200) + 'px';
    p.style.width = p.style.height = (8 + Math.random()*8) + 'px';
    p.style.borderRadius = '50%';
    p.style.background = `hsl(${Math.random()*360} 70% 60%)`;
    p.style.opacity = '0.9';
    p.style.transition = `transform ${1+Math.random()}s linear, opacity 1s ease`;
    document.body.appendChild(p);
    requestAnimationFrame(()=> {
      p.style.transform = `translateY(${200 + Math.random()*200}px) translateX(${(Math.random()-0.5)*200}px)`;
      p.style.opacity = '0';
    });
    setTimeout(()=>p.remove(), 1600);
  }
}

/* HISTORY */
function recordHistory(){
  const gameName = "Arrastar e soltar";
  let historico = JSON.parse(localStorage.getItem("gameHistory")) || {};
  if (!historico[gameName]) historico[gameName] = { plays:0 };
  historico[gameName].plays += 1;
  localStorage.setItem("gameHistory", JSON.stringify(historico));
}

/* RESTART */
document.getElementById('restart-button').addEventListener('click', resetGame);
function resetGame(){
  current = 0;
  cloudItem.src = itemImages[sequence[current]];
  cloudItem.style.opacity = '.35';
  instructionText.textContent = instructionSequence[current];
  document.querySelectorAll('.option').forEach(opt => opt.classList.remove('hidden','dragging'));
  if(robot){ robot.remove(); robot = null; }
  if(currentRobotSound){ currentRobotSound.loop=false; currentRobotSound.pause(); currentRobotSound.currentTime=0; currentRobotSound=null; }
}

/* ========== Parental control ========== */
function startTimerGame(){
  clearInterval(window.limitCheckerGame);
  window.limitCheckerGame = setInterval(()=>{
    const gameLimit = parseInt(localStorage.getItem('gameLimit')) || 0;
    const gameStart = parseInt(localStorage.getItem('gameStart')) || 0;
    if(gameLimit && gameStart){
      const elapsed = (Date.now() - gameStart)/1000;
      if(elapsed >= gameLimit){
        clearInterval(window.limitCheckerGame);
        const lock = document.getElementById('lock-screen');
        lock.style.display = 'flex';
        lock.setAttribute('aria-hidden','false');
      }
    }
  }, 1000);
}

function unlockGame(){
  const input = document.getElementById('unlockPassword').value;
  const savedPassword = localStorage.getItem('parentPassword') || '1234';
  const feedback = document.getElementById('unlockFeedback');
  if(input === savedPassword){
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('unlockPassword').value = '';
    feedback.textContent = '';
    localStorage.setItem('gameStart', Date.now());
    startTimerGame();
  } else {
    feedback.textContent = 'Senha incorreta!';
  }
}

if(localStorage.getItem('gameLimit') && localStorage.getItem('gameStart')){
  startTimerGame();
}

/* ========== Install prompt handling ========== */
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
installBtn.style.display = 'none';
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-grid';
});
installBtn.addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = 'none';
});

/* ========== Service Worker registration ========== */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> {
    navigator.serviceWorker.register('sw.js').then(reg => {
      console.log('SW registrado', reg);
    }).catch(err => console.warn('Erro ao registrar SW', err));
  });
}

/* ========== Accessibility: keyboard focus styles ========== */
document.addEventListener('keydown', (ev)=>{
  if(ev.key === 'Escape') {
    // close overlays if any
    startScreen.style.display = 'none';
    document.getElementById('lock-screen').style.display = 'none';
  }
});

/* ========== utility: handle native drop from pointer events on cloud ========== */
cloudContainer.addEventListener('pointerup', (e)=> {
  // in case dragging is null, maybe file drop ignored
});
</script>

</body>
</html>
