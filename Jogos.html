<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seleção de Jogos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="./manifest.json">
<style>
    body {
        font-family: 'Fredoka', sans-serif;
        background: linear-gradient(135deg, #fbc2eb, #a6c0fe);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
        overflow-x: hidden;
        position: relative;
    }

    h1 {
        color: #fff;
        font-size: clamp(2rem, 6vw, 3rem);
        margin-bottom: clamp(1rem, 4vw, 2rem);
        text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
    }

    .games-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: clamp(1rem, 4vw, 2rem);
        width: 95%;
        max-width: 900px;
        margin-top: clamp(3vh, 5vh, 8vh);
        justify-items: center;
        align-items: center;
    }

    .game-card {
        position: relative;
        cursor: pointer;
        overflow: hidden;
        border-radius: 25px;
        transition: transform 0.3s, box-shadow 0.3s;
        width: 100%;
        max-width: 400px;
        aspect-ratio: 1;
    }

    .game-card:hover {
        transform: scale(1.05);
        box-shadow: 0 12px 25px rgba(0,0,0,0.3);
    }

    .game-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 25px;
    }

    .game-card p {
        position: absolute;
        bottom: clamp(5px, 2vh, 10px);
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        font-weight: bold;
        font-size: clamp(1rem, 3vw, 1.4rem);
        color: #fff;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        background: rgba(0,0,0,0.2);
        padding: clamp(0.2rem, 1vw, 0.3rem) clamp(0.5rem, 2vw, 0.8rem);
        border-radius: 10px;
    }

    .back-button {
        position: absolute;
        top: clamp(10px, 2vh, 20px);
        left: clamp(10px, 2vh, 20px);
        width: clamp(50px, 8vw, 60px);
        height: clamp(50px, 8vw, 60px);
        border-radius: 50%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        text-decoration: none;
        transition: transform 0.2s;
    }

    .back-button:hover {
        transform: scale(1.1);
    }

    .back-button-icon {
        font-size: clamp(1.5rem, 3vw, 2rem);
        color: #8862d8;
    }

    /* Responsive Media Queries for Jogos.html */
    @media (max-width: 600px) {
        body {
            padding: 1rem;
        }
        
        .games-container {
            grid-template-columns: 1fr;
            gap: 1rem;
            width: 95%;
            margin-top: 3vh;
        }
        
        .game-card {
            max-width: 100%;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        .back-button {
            width: 50px;
            height: 50px;
            top: 10px;
            left: 10px;
        }
        
        .back-button-icon {
            font-size: 1.5rem;
        }
        
        .game-card p {
            font-size: 1rem;
            padding: 0.2rem 0.5rem;
        }
    }

    @media (min-width: 601px) and (max-width: 900px) {
        .games-container {
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }
        
        h1 {
            font-size: 2.5rem;
        }
    }
</style>
</head>
<body>

<a href="telainicial.html" class="back-button">
    <span class="back-button-icon">⬅</span>
</a>


<div class="games-container">
    <div class="game-card" onclick="location.href='conectarfios.html'">
        <img src="nuvemjogo1.png" alt="Conectar Fios">
        <p>Conectar Fios</p>
    </div>
    <div class="game-card" onclick="location.href='arrastaresoltar.html'">
        <img src="nuvemjogo2.png" alt="Itens na nuvem">
        <p>Arrastar e Soltar</p>
    </div>
    <div class="game-card" onclick="location.href='protegernuvens.html'">
        <img src="nuvemjogo3.png" alt="Proteger Nuvens">
        <p>Proteger Nuvens</p>
    </div>
    <div class="game-card" onclick="location.href='publicaeprivada.html'">
        <img src="nuvemjogo4.png" alt="Pública e Privada">
        <p>Pública e Privada</p>
    </div>
</div>
<script src="./register-sw.js"></script>
</body>
</html>

<style>
/* Responsive Media Queries for Jogos.html */
@media (max-width: 600px) {
    .games-container {
        grid-template-columns: 1fr;
        gap: 1rem;
        width: 95%;
        margin-top: 3vh;
    }
    
    .game-card {
        max-width: 100%;
    }
    
    h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
    }
    
    .back-button {
        width: 50px;
        height: 50px;
        top: 10px;
        left: 10px;
    }
    
    .back-button-icon {
        font-size: 1.5rem;
    }
    
    .game-card p {
        font-size: 1rem;
        padding: 0.2rem 0.5rem;
    }
}

@media (min-width: 601px) and (max-width: 900px) {
    .games-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
    }
    
    h1 {
        font-size: 2.5rem;
    }
}
</style>
